server {
    listen 80;
    server_name _;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # API proxy to backend service
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Static assets under /sparrow_agent/ — long cache (content-hash filenames)
    location /sparrow_agent/assets/ {
        alias /usr/share/nginx/html/sparrow_agent/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — match vite base path /sparrow_agent/
    location /sparrow_agent/ {
        alias /usr/share/nginx/html/sparrow_agent/;
        index index.html;
        try_files $uri $uri/ /sparrow_agent/index.html;
    }

    # Redirect root to /sparrow_agent/
    location = / {
        return 302 /sparrow_agent/;
    }
}
